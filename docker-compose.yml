version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diamantes
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # prisma/data conserva la SQLite antigua (fuente de la migración one-shot
      # a Postgres) y el .auth-secret persistente
      - ./data:/app/prisma/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      # Postgres (servicio Dokploy en la misma VPS). Si esta URL falla, el
      # fallback del Dockerfile es la SQLite del volumen.
      - DATABASE_URL=postgresql://postgres:vvrHVTs6QB2eBOA1RgC5@diamantes-vip-datab-04a60v:5432/diamantesdibi
      - PORT=3000
    networks:
      - default
      # Red de Dokploy: necesaria para resolver el hostname del Postgres
      - dokploy-network

networks:
  dokploy-network:
    external: true
