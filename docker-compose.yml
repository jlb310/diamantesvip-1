version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diamantes
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # prisma/data conserva la SQLite antigua (fuente de la migración one-shot
      # a Postgres) y el .auth-secret persistente
      - ./data:/app/prisma/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      # La URL real del Postgres NO va en el repo: se inyecta por env
      # (en prod vive en el Environment del servicio en Dokploy).
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3000
    networks:
      - default
      # Red de Dokploy: necesaria para resolver el hostname del Postgres
      - dokploy-network

networks:
  dokploy-network:
    external: true
